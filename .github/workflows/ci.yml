name: Test PR

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v2.4.1
      with:
        version: 8

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: pnpm

    - name: Install Dependencies
      run: pnpm install

    - name: Launch tests
      run: pnpm test
      env:
        COVERAGE: true

    - name: Coverage Diff
      uses: greatwizard/coverage-diff-action@v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

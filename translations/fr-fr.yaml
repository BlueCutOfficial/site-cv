  slot:
    bewilderhouse:
      label: "Bewilder House"
      intro: "Vous vous réveillez dans une étrange funhouse qui joue avec vos repères et semble déterminée à vous garder pris au piège. Le seul moyen de vous échapper sera de venir à bout des énigmes de spatialisation (et de rester en vie) via une utilisation originale des contrôles en première personne. \"Good luck, Mister Grown up\"."
      trailer: "Trailer de Bewilder House"
      linkGamejolt: "Bewilder House est gratuit et disponible sur Gamejolt. <strong><a class=\"important\" target=\"_blank\" href=\"{gamejolt}\" rel=\"noopener noreferrer\">Télécharger-le ici</a></strong> et laissez-nous votre avis ! (Si vous avez aimé le jeu, un petit 5/5 sur Gamejolt augmentera notre visibilité sur le site 😄)"
      linkFacebook: "N'hésitez pas à laisser un petit like sur notre <strong><a class=\"important\" target=\"_blank\" href=\"{facebook}\" rel=\"noopener noreferrer\">page Facebook</a></strong>."
      linkMail: "Si vous souhaitez dire un mot à la Minoteam, nous avons aussi une adresse mail : <strong>bewilderhouse@gmail.com</strong>."
      about: "Comme le veut la tradition à Supinfogame, la dernière année d’étude consiste à produire un prototype de jeu de qualité, dans une équipe de 5 ou 6 étudiants. Mon projet de fin d’étude se nomme Bewilder House. L’auteur du concept d’origine est Robin Vallery. Au fil de l’année, tous les membres de l’équipe se sont appropriés le concept et ont fait de Bewilder House le jeu qu’il est aujourd’hui."
      trailerUniverse: "Premier trailer univers réalisé avec 3DS Max au cours du développement du projet. L'objectif était de donner une première idée de l'ambiance du prototype final (on peut y voir ce que fut le clown en des temps très anciens ^^)."
      gd1: "Bewilder House est un puzzle game en première personne qui place la perte de repère et l’observation au coeur du gameplay."
      gd2: "Le joueur est perdu dans un labyrinthe constitué de salles identiques et dont la sortie est invisible. Il a en sa possession une carte du labyrinthe indiquant deux informations : l’emplacement de la sortie ainsi que des icônes représentant des repères présents dans le labyrinthe; et c'est tout, le joueur ne connait pas sa propre position."
      gd3: "Le joueur explore donc le labyrinthe à la recherche de ces repères afin de se spatialiser et de comprendre où se trouve la sortie. Il doit alors rejoindre cette sortie invisible et la « révéler » à l’aide d’une touche."
      gd4: "Cependant, le labyrinthe a un comportement bien étrange : les portes s’ouvrent et se ferment lorsque le joueur ne les regarde pas, il est donc impossible de se repérer à l’aide des chemins précédemment empruntés, puisque ces chemins changent sans cesse."
      universeIntro: "Notre univers a été défini autour de trois points clés :"
      universeContent: "<li>Renforcer la perte de repère par le biais d’un environnement qui joue avec les perceptions.</li><li>Renforcer le sentiment d’enfermement en proposant un lieu clos.</li><li>Renforcer le sentiment que le labyrinthe joue avec le joueur en en faisant une entité vivante de par l’utilisation du genre fantastique.</li>"
      universeConclusion: "Ainsi, dans Bewilder House, le joueur explore une étrange funhouse contenant tapis roulants, mécanismes en mouvement, objets qui changent de place lorsqu’il ne les regarde pas et visages clownesques angoissants."
      minoteam: "<strong>Pourquoi l'équipe qui a développé Bewilder House s'appelle la Minoteam ?</strong>"
      minotaure: "Parce que le concept original du jeu s'appelait \"Minotaure\" ! Le nom du jeu a changé au cours du développement, mais l'équipe a conservé le nom Minoteam."
    dysd:
      label: "Do You Speak Digital ?"
      intro: "Un COOC (Corporate Online Open Course) gamifié sur le thème des nouvelles technologies et d'Internet, développé avec AXA Groupe."
      about: "Do You Speak Digital ? est un COOC gamifié que Fremen Corp a développé pour AXA Groupe. Il porte sur le thème du \"digital\". Les utilisateurs sont invités à s'informer sur des sujets tels que les moteurs de recherche, les données personnelles, les nouvelles technologies... à travers des vidéos et des quiz. Le projet a été déployé chez AXA en 2015 et a eu un très bon taux de participation."
      tech: "Ce projet court, développé sur deux mois, est le premier véritable projet Web que j'ai mené seule, de A à Z, et à l'aide d'un framework JS. À l'époque (j'étais très junior, je travaillais depuis moins d'un an), j'avais choisi Backbone JS. Les délais étant très serrés, n'ayant jamais utilisé de framework JS, et sans aucun développeur plus expérimenté pour me guider, j'avais besoin d'un framework facile à prendre en main du point de vue de ma seule expérience de développeuse Unity. Or le pattern MVC de Backbone me paraissait bien identifiable et j'y trouvais mes repères. Mon choix devait être le bon, car le projet a été livré dans le temps imparti :)"
    ecosmart:
      label: "Eco smart"
      intro: "Eco, un mignon petit robot, est envoyé chez les humains par son créateur, afin de les aider à faire des économies d'énergie."
      about: "Eco Smart est un serious game sur le thème de la consommation d'énergie, développé par Fremen Corp pour EDF. Il a été construit sur le moteur développé pour Energy Cat, et comporte quelques nouveautés (refonte du système de chauffage, vue quartier...)"
      title1: "Développement de shaders"
      content1: "<p>Comparé à Energy Cat, qui se voulait réaliste, la direction artistique d'Eco Smart est beaucoup plus épurée, les textures ont été simplifiées mais ne sont pas inexistantes. Leur teinte blanche permet de mettre en avant le \"pulse\" des objets énergivores, dont la couleur correspond au fameux code A, B... G.</p><p>Eco Smart m'a permis de mettre les mains dans le développements de shaders. J'en ai développé deux:<ul><li>Un premier pour ombrer les objets et la scène d'une légère teinte bleue.</li><li>Le shader de \"pulse\" permettant de faire clignoter lentement un objet dans la couleur souhaitée.</li></ul></p>"
      title2: "Librairie de matériaux"
      content2: "<p>La \"Librairie de matériaux\" est une initiative personnelle dont le développement m'a particulièrement intéressée. Mettons que sur une même texture, le graphiste ait condensé un frigo de consommation A, une cuisinière de consommation F et quelques autres objets non énergivores. Pour palier à tous les cas, il semble que trois matériaux doivent être créés à partir de cette texture : le standard, le pulse A et le pulse G. A priori, je n'ai pas besoin des autres matériaux de pulse.</p><p>Créer tous les bons matériaux à partir des codes des objets présents, sans se tromper, et les configurer à la main aurait demandé un temps considérable, d'autant plus qu'une scène ne les utilise pas forcément tous. Peut-être que la maison 3 possède la cuisinière mais pas le frigo. De plus, si le PNJ n'allume jamais la cuisinière pendant la session de jeu, son matériau de pulse ne sera jamais utilisé.</p><p>J'ai donc développé un système qui permet de créer un matériau à la volée pendant le jeu, à partir du matériau standard et du code énergie. Ainsi : <ul><li>Le minimum de matériau nécessaire à la scène est créé.</li><li>Si une texture possède deux objets de même consommation qui sont allumés en même temps, le même matériau de pulse est réutilisé, comme s'il avait été créé en amont.</li></ul></p>"
    eds:
      label: "AXA Esprit de service"
      intro: "Un serious game sur le thème de la relation client, développé par Fremen Corp avec AXA France."
      about: "Esprit De Service est un serious game qui a été déployé sur l'intranet de AXA France en 2014. Il vise à améliorer la relation client à travers notamment des mini-jeux de dialogue. Le haut taux de participation des salariés au serious game a encouragé AXA à développer d'autres projets du même type, et FremenCorp a par la suite développé un second serious game Esprit De Service 2."
    energycat:
      label: "Energy Cat"
      intro: Energy Cat rêve de vivre dans la maison du futur. Tout en avançant pas à pas vers son rêve, aidez-le à gérer sa maison et empêcher son humain de gaspiller trop d'énergie.
      image: Capture d'écran de l'intro de Energy Cat
      about: EnerGAware est un projet européen porté par l'université de Plymouth. L'un des aspects du projet était la réalisation d'un serious game permettant la prise de conscience de gestes quotidiens simples à réaliser pour économiser l'énergie. Ce serious game est Energy Cat, réalisé par Fremen Corp.
      link: "Visitez <strong><a class=\"important\" target=\"_blank\" href=\"{energaware}\" rel=\"noopener noreferrer\">le site Web</a></strong> d'EnerGAware pour plus d'informations sur le projet, les partenaires et pour découvrir davantage d'images du jeu."
    formidable:
      label: "Formidable"
      intro: "Formidable est un puissant éditeur de formulaires. Il permet aux administrateurs RH de créer leurs propres formulaires, puis il les affiche en tant que formulaire à remplir par un employé. Formidable gère des cas d'usage métier très complexes qui seraient très difficiles à mettre en oeuvre avec une solution externe."
    homeplay:
      label: "Homeplay"
      intro: "Homeplay est un projet d'application servant de contrôleur principal pour différents objets connectés de la maison."
      apis: "L'application, prévue pour iOS, était développée en Objective-C. L'interface consistait en une télécommande unique permettant de régler différents types d'objets connectés, il fallait donc faire coexister les différentes API permettant d'enregistrer et contrôler chaque objet. Ainsi, l'application consommait l'API publique de Parrot (pour indiquer les besoins des plantes d'intérieures), celle de Netatmo (dont le capteur communique la température ou encore la qualité de l'air), et intégrait le SDK de Philips Hue (pour créer des ambiances colorées à l'aide de lampes Hue.)"
      limitations: "Les spécifications de Homeplay comprenaient certaines contraintes, qui faisaient de l'application en elle-même un simple proof of concept. Tout d'abord, il s'agissait de voir jusqu'où il était possible d'aller sans l'intervention d'un serveur externe. Cette contrainte a rapidement montré la limite du concept, car il était difficile de programmer des actions à l'avance. En effet, l'iPhone devait capter le wi-fi de la maison pour agir sur les appareils. De plus, la variété des APIs et des SDKs des constructeurs impliquaient une intégration au cas par cas, et certains appareils, comme l'arroseur connecté de Parrot, requieraient un mode de communication particulier comme un Bluetooth bien précis. Un utilisateur intéressé par les possibilités de Homeplay n'aurait donc pas forcément vu d'intérêt à acquérir tous les objets."
      context: "Le projet était porté par la société Ecometering, qui avait chargé FremenCorp de l'implémentation."
    imagana:
      label: "Imagana"
      intro: "Un serious game à destination des personnes en situation d’illettrisme. Incarnez Mô, un personnage possédant le pouvoir de créer des objets à partir des phonèmes qui les composent. Utilisez cette capacité afin de franchir des obstacles."
      trailer: "Cinematique d'introduction de Imagana"
      about1: "Imagana est un projet porté par la société Formagraph et sur lequel j'ai travaillé pendant 9 mois au cours de son développement, d'abord en tant que stagiaire de Formagraph, puis en tant que salariée de FremenCorp."
      about2: "Il s'agit d'un projet intelligent auquel je suis fière d'avoir participé. C'est un serious game qui ose être \"un vrai jeu\", un concept vers lequel tout serious game devrait tendre. Travailler sur ce projet a été très enrichissant."
      links1: "Malheureusement, le site qui hébergeait la version en ligne d'Imagana a été racheté, suite à la fermeture de Formagraph."
      links2: "Consultez <strong><a target=\"_blank\" class=\"important\" href=\"{facebook}\" rel=\"noopener noreferrer\">la page Facebook</a></strong> du jeu."
      gameplay1: "Video de gameplay de Imagana"
      gameplay2: "Cette vidéo de gameplay est ancienne, mais elle montre l'état du projet à l'époque où je travaillais dessus. J'ai implémenté de nombreux éléments que vous voyez à l'écran :<ul><li>Tout d'abord le système principal de slot de phonèmes qui permet de faire apparaître les \"artéfacts\" (objets contenus dans les sphères), et dont j'ai participé au design.</li><li>Le drag and drop des phonèmes, qui viennent se fixer au slot le plus proche.</li><li>Egalement de nombreux FX comme la lumière des slots, le clignotement des obstacles sur lesquels poser les artéfacts, l'animation des gemmes rouges vers le compteur de l'UI...</li><li>J'ai également écris le shader bleuté utilisé pour les artéfacts.</li></ul>J'ai implémenté encore bien d'autres fonctionnalités sur Imagana, et travailler sur ce projet était un réel bonheur."
      universe1: "L'univers d'Imagana se veut coloré et fantaisiste. Les personnes en situation d'illettrisme vivent parfois des moments difficiles au quotidien. L'équipe de Formagraph ne souhaitait pas se diriger vers une direction artistique réaliste, qui aurait pu reproduire des schémas de tous les jours, plaçant le joueur dans un état d'anxiété."
      universe2: "Ainsi, le choix a été fait de placer le joueur dans un univers qui lui permet de rêver, et d'apprendre à son rythme sans se soucier du monde réel."
      anecdote: "Pendant mon stage chez Formagraph, la pédagogue Danielle Chopinot m'a emmenée à quelques sessions de playtest à l'IFPA (Institut de Formation et de Promotion des Adultes). J'ai pu observer comment des joueurs en situation d'illettrisme se comportaient avec les mécaniques que j'avais implémentées, et j'ai entrevu un univers qui m'était jusqu'alors inconnu."
    lepetitspirou:
      label: "Le Petit Sprirou : Le jeu"
      intro: "Un jeu de plateforme rendant hommage à la célèbre bande dessinée du même nom. Le joueur incarne le Petit Spirou et se déplace de bêtise en bêtise par les fenêtres d'une bande dessinée."
      about1: "Ce jeu est issu d'un partenariat entre Supinfogame et les éditions Dupuis. Toutes les promotions confondues de Supinfogame ont été réparties en quelques groupes qui devaient réaliser un jeu à partir de l'univers d'une bande dessinée publiée par Dupuis."
      about2: "Mon groupe a donc travaillé à partir du Petit Spirou. Le premier prototype a été produit par l’équipe en deux semaines et proposé aux éditions Dupuis. Enthousiasmée par notre travail, la direction de Dupuis a choisi de mener le projet à son terme, et le jeu a été publié le 10 Septembre 2012 sur bandgee.com (le site a fini par être fermé)."
    linkygame:
      label: "Linky Game"
      intro: "Apprenez à reconnaître les objets énergivores et dangereux aux côtés de Linky, et sauvez les kilowatt-heure."
      about: "Linky Game est un petit runner développé par FremenCorp pour ERDF Champagne-Ardennes. L'avatar du joueur est une personnification du compteur Linky, qui doit se connecter aux différents objets énergivores. Linky Game s'adresse à un public jeune et a été réalisé avec la participation de classes élémentaires et moyennes d'écoles de la région. Les enfants ont conçu les niveaux de jeu lors d'ateliers."
    mypeopledoc:
      label: "MyPeopleDoc"
      intro: "MyPeopleDoc est un coffre-fort personnel dématérialisé sur lequel les employés reçoivent leurs fiches de paie mensuelles et d'autres documents professionnels."
      about: "Parmi tous les produits développés par PeopleDoc, MyPeopleDoc a la particularité d'être plus proche d'un BtoC. Le coffre-fort dématérialisé est personnel et a vocation à suivre l'employé durant sa carrière. En effet, les fiches de paie et autres documents doivent rester accessible même si l'employé change d'emploi, et le coffre peut être utilisé pour uploder et conserver des documents."
      title1: "À propos de mon affectation au projet"
      content1: "Une fois achevées les pricipales fonctionnalités du coffre-fort dématérialisé (~2016), l'équipe a été assignée à d'autres projets.  Les développeurs historiques pouvaient ponctuellement gérer les maintenances les plus importantes ou l'ajout de fonctionnalités liées à la sécurité. Fin 2021, l'entreprise a souhaité remonter une équipe plus solide pour le coffre-fort. J'ai choisi d'être assignée au frontend car je voulais travailler pour nos utilisateurs dans un contexte davantage BtoC."
      title2: "Accessibilité"
      content2: "Le Web change vite. En 2016, l'accessibilité était moins au coeur des préoccupations qu'aujourd'hui, et les développeurs frontend étaient moins sensibilisés à ces problématiques. En six ans, l'équipe UX de PeopleDoc a fait un travail considérable autour de l'accessibilité et sur la transmission de connaissance. En arrivant sur un projet depuis longtemps en \"Best effort\", la modernisation du code et la refactorisation des templates pour un DOM plus intuitif et accessible ont été mon principal angle d'attaque au niveau frontend."
    reef:
      label: "Reef"
      intro: "Un jeu appaisant destiné à informer le public sur la technologie Biorock, qui encourage le développement de récifs coralliens. Reef a été sélectionné pour la finale de l’Imagine Cup France 2012, et a fait partie des cinq meilleurs projets français dans la catégorie game design."
      content1: "Reef a été imaginé dans le cadre de la participation à l'Imagine Cup 2012, section game design. Ce concours étant organisé par Microsoft, le prototype a été développé pour Windows Phone 7."
      content2: "Reef était le projet de mes coéquipiers, Philippe, Marie et Marc. Je me suis proposée de les rejoindre car ils étaient en recherche d'un développeur pour concrétiser leur concept."
      content3: "Comme Reef a été sélectionné pour la finale française, nous avons participé au Bootcamp ! Microsoft nous a invité dans une immense propriété, avec toujours nourriture et boisson à portée de main. Nous avons passé la nuit à développer, soutenus par les coaches de Microsoft, et nous avons fait des présentations en anglais devant les jury."
    renard:
      label: "L'Académie des Renards"
      intro: "L'Académie des Renards est ma collection de romans fantasy young adult. Découvrez l'ensemble de l'univers sur mon site d'auteure."
      site: "Visiter le site de l'Académie des Renard"
      drawings: "De nouveaux extraits et visuels de l'univers sont publiés chaque semaine sur mon compte Instagram."
      checkInstragram: "Voir le compte Instagram"
      iconInstragram: "Logo Instagram"
    selfsite:
      label: "Ce site web \\o/"
      intro: "Étant donné que je développe pour des entreprises privées, il est difficile pour vous, visiteur, de vous faire une idée de la manière dont je travaille. En effet, la plupart des projets auxquels j'ai contribué durant ma carrière sont situés dans des répertoires privés. Mais heureusement, j'ai créé ce site, et comme il est hébergé sur Github Pages gratuitement, je n'ai pas d'autre choix que de laisser le répertoire public. Plutôt que de voir ça comme un inconvénient, je préfère le voir comme une opportunité de vous montrer comment je travaille habituellement :)"
      repo: "Le code source de ce site web est disponible <strong><a target=\"_blank\" class=\"important\" href=\"{github}\" rel=\"noopener noreferrer\">sur mon Github</a></strong>."
      emberTitle: "Ember"
      emberContent: "<p>Ce site web est développé avec le framework Ember JS. J'ai commencé à travailler avec Ember en 2017, juste avant d'être embauchée par PeopleDoc.</p><p>Avant de devenir développeuse web, j'étais développeuse Unity. Unity est un écosystème fermé qui fournit tout ce dont vous avez besoin pour construire un jeu : outils intégrés au moteur, plugins publics, interface de monitoring pour analyser et builder sur les OS cibles, documentation, forum... tout est \"made in Unity\". Avec ce background, acquérir \"l'approche puzzle\" que requiert le développement web a été pour moi un défi. Le crédo \"convention over configuration\" d'Ember, le fait que le framework fournisse toutes les fonctionnalités clés pour construire une app (templates, routing, tests...), les recommendations des guides Ember et l'existence de <strong><a href=\"https://emberobserver.com/\" rel=\"noopener noreferrer\" class=\"important\" target=\"_blank\">Ember Observer</a></strong>... tout cela m'a été d'une grande aide pour me remettre au développement web après tant de temps passé sur un moteur de jeu.</p><p>Quelques années plus tard, j'aime toujours Ember, pour des raisons légèrement différentes. La principale d'entre elles est que c'est un framework qui appartient à sa communauté et grandit avec elle. Le framework évolue encore et toujours, les membres de la core team viennent d'entreprises différentes, la qualité de la documentation est impressionnante et encourage les nouveaux développeurs à s'impliquer dans la vie du framework.</p>"
      gpTitle: "Bonnes pratiques"
      gpContent: "<p>Depuis que ce répertoire est devenu public, j'ai consacré davantage d'efforts à le faire ressembler à mes répertoires professionnels (et comme le commit initial date de 2019, la partie \"faire avec le legacy\" est aussi incluse 😉)</p><ul><li><strong>Déploiement automatisé:</strong> l'application contient deux workflows Github, un pour les push sur les PRs et l'autre pour les push sur master. Les deux lancent la suite de test, et le workflow master déclenche le déploiement de l'app sur Github Pages à l'aide d'une Github action publique.</li><li><strong>Couverture de test (coverage):</strong> Ember intègre QUnit pour écrire les tests frontend. Cette app inclut quelques tests. Un outil de coverage est installé et calcule le coverage quand les tests sont lancés par la CI Github. Le workflow Github contient également l'appel à une Github action qui compare les coverages de la PR et de master.</li><li><strong>Une commit stack propre:</strong> tant que l'histoire n'est pas sur master, c'est vous qui écrivez l'histoire. À mon sens, le propos de la commit stack d'une PR n'est pas de refléter l'histoire <em>vraie</em> de comment l'implémentation courante a été obtenue. Il s'agit plutôt de montrer l'histoire <em>attendue</em>. La stack aide les reviewers à comprendre comment la fonctionnalité a été construite, étape par étape, bloc logique par bloc logique. Si obtenir cet historique implique quelques rewrite, squash, drop, fixup et rebase, ce n'est pas du tout un problème.</li><li><strong>PRs documentées:</strong> il n'y a que de bonnes raisons de documenter les PRs. Introduire des changements via une explication littéraire est une façon d'aider les reviewers à entrer dans la review en les laissant prendre connaissance du contexte avant qu'ils ne voient le code. C'est important, même si l'entreprise utilise un produit comme JIRA ou Trello, car la description d'un ticket est souvent orientée produit et ne considère pas la logique d'implémentation. La description de PR est un moyen d'expliquer l'aspect purement technique du ticket. En l'écrivant, vous allez également vous aider vous-mêmes, par exemple quand vous tentez de vous rappeler le propos d'un bloc de code et que les 'git blame' successifs vous mènent à une PRs en particulier.</li></ul>"
    srg:
      label: "Star Runner: Genesis"
      intro: "Dans ce jeu d'aventure spatial, explorez l'univers avec votre vaisseau, commercez pour l'améliorer et combattez pour le camp que vous avez choisi."
      about: "Star Runner: Genesis est un jeu Flash auto-publié par FremenCorp sur la plateforme Kongregate. Il se place dans la liste des projets Fremen comme un petit clin d'oeil à l'industrie du jeu vidéo classique, d'où proviennent les différents associés, et surtout à la science fiction, une littérature appréciée des fondateurs de l'entreprise."
    stupidhermitcrab:
      label: "Stupid Hermit crab"
      intro: "Une colonie de planctons habite sur un Bernard L’ermite particulièrement stupide. Pour assurer la survie de leur hôte, les planctons créent dans son cerveau des connexions neuronales."
      download: "Testez Stupid Hermit Crab ! <strong><a target=\"_blank\" class=\"important\" href=\"{mediafire}\" rel=\"noopener noreferrer\">Téléchargez-le ici</a></strong> avec MediaFire et lancez le .exe qui se trouve dans le zip."
      content1: "Pas le temps de tester Stupid Hermit Crab ? C'est bien dommage, mais vous pouvez jeter un coup d'oeil à cette vidéo pour vous faire une petite idée du jeu."
      content2: "Stupid Hermit Crab est un projet auquel j'ai participé à Supinfogame. Il a été réalisé à partir de la direction artistique d’un autre projet étudiant : Crustacity. La consigne donnée était de s’approprier l’univers d’un autre groupe afin de créer un puzzle game. L’objectif véritable du projet était de tester l’efficacité des équipes constituées pour l’année suivante. Notre groupe s’est révélé efficace. Nous avons réalisé un prototype de bonne qualité dans le temps imparti et dans la bonne entente. Ainsi, la meilleure note de la promotion nous a été attribuée."
      content3: "Avez-vous remarqué ? Stupid Hermit Crab a été réalisé par la Minoteam ! En effet, le but du projet était de tester les équipes qui travailleraient ensemble toute l'année suivante. Et l'année suivante, nous avons réalisé Bewilder House."
    superkoala:
      label: "Super Koala Jetpack Revenge"
      intro: "Un Koala part à la poursuite de ses précieuses feuilles d’eucalyptus, emportées par les humains à bord d’un avion. Pour les récupérer, le marsupial se munit d’un aspirateur et d’un jetpack produisant une fumée opaque. Son but : aspirer le plus de feuilles possible en évitant ses poursuivants, dissimulés sous la fumée du jetpack."
      content1: "Super Koala Jetpack Revenge est un projet réalisé pendant la seconde \"semaine intensive\" de mon cursus à Supinfogame, il s'agit également de mon premier essai avec Flash en tant que graphiste... On peut dire que j'ai bien progressé depuis ^^, mais je suis quand même contente de ce petit jeu décalé réalisé avec Alexis et Valentin, mes coéquipiers de la Minoteam."
    travel:
      label: "Carnets de voyage"
      intro: "Quand je voyage, j'aime consigner toutes mes aventures dans un petit carnet que je promène partout avec moi."
      japanIntro: "En 2017, j'ai eu la chance de passer 16 jours au Japon. Une partie de mon carnet de voyage est disponible en ligne."
      japanNotes: "Découvrez mes notes de voyage sur Panosyssey"
